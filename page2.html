<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Salon - ติดต่อ & จองคิว</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#D48B71',
                        'brand-hover': '#C07960',
                        'bg-main': '#FAF8F5',
                        'bg-alt': '#F4EFEA',
                        'text-dark': '#333333',
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-bg-main text-text-dark min-h-screen flex flex-col">

    <nav class="w-full bg-bg-main py-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-semibold">
                <i class="fa-solid fa-scissors text-brand"></i>
                <span><span class="text-brand">Bella</span> Salon</span>
            </a>

            <div class="hidden md:flex gap-8 font-medium">
                <a href="index.html" class="text-gray-500 hover:text-brand transition">หน้าแรก</a>
                
                <a href="reserve.html" class="text-brand border-b-2 border-transparent transition">ติดต่อ / จองคิว</a>
            </div>
        </div>
    </nav>

    <div class="pt-12 pb-8 text-center px-4">
        <p class="text-brand text-sm font-medium mb-1">Contact & Booking</p>
        <h1 class="text-3xl md:text-4xl font-semibold">ติดต่อ & จองคิว</h1>
    </div>

    <section class="max-w-5xl mx-auto px-6 pb-20 w-full flex-grow">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <div>
                <h2 class="text-xl font-semibold mb-6">ข้อมูลติดต่อ</h2>
                
                <div class="flex flex-col gap-6 mb-8">
                
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 bg-[#F2DFD8] text-brand rounded-full flex items-center justify-center flex-shrink-0 text-xl">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div class="mt-1">
                            <p class="text-gray-700">123 ถ.สุขุมวิท แขวงคลองเตย</p>
                            <p class="text-gray-700">เขตคลองเตย กรุงเทพฯ 10110</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-[#F2DFD8] text-brand rounded-full flex items-center justify-center flex-shrink-0 text-xl">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <div>
                            <p class="text-gray-700">02-123-4567</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-[#F2DFD8] text-brand rounded-full flex items-center justify-center flex-shrink-0 text-xl">
                            <i class="fa-regular fa-clock"></i>
                        </div>
                        <div>
                            <p class="text-gray-700">ทุกวัน 10:00 - 20:00 น.</p>
                        </div>
                    </div>
                </div>

                <div class="rounded-xl overflow-hidden border border-gray-200 shadow-sm h-64 w-full">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d16051.37679385219!2d100.57942130929045!3d13.709259216358157!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30e29fbfeac470a3%3A0x70db9b8de235da2b!2s123%20Sukhumvit%20Rd%2C%20Khwaeng%20Phra%20Khanong%2C%20Khet%20Khlong%20Toei%2C%20Krung%20Thep%20Maha%20Nakhon%2010110!5e0!3m2!1sen!2sth!4v1786546618498!5m2!1sen!2sth" 
                    width="600" 
                    height="450" 
                    style="border:0;" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                </div>
            </div>

            <div>
                <h2 class="text-xl font-semibold mb-6">จองคิวออนไลน์</h2>
                
                <form action="#" method="POST" class="flex flex-col gap-5">

                    <div>
                        <label class="block text-gray-700 text-sm mb-2" for="name">ชื่อ-นามสกุล</label>
                        <input type="text" id="name" placeholder="กรุณากรอกชื่อของคุณ" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-white transition">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm mb-2" for="phone">เบอร์โทรศัพท์</label>
                        <input type="tel" id="phone" placeholder="0XX-XXX-XXXX" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-white transition">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm mb-2" for="service">บริการที่ต้องการ</label>
                        <input type="text" id="service" placeholder="เช่น ตัดผม, ทำสี, ทำเล็บ" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-white transition">
                    </div>

                    <div>
                        <label class="block text-gray-700 text-sm mb-2" for="message">ข้อความเพิ่มเติม</label>
                        <textarea id="message" rows="4" placeholder="วัน / เวลาที่สะดวก หรือรายละเอียดเพิ่มเติม" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand bg-white transition resize-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-brand hover:bg-brand-hover text-white font-medium py-3 rounded-lg transition shadow-sm mt-2">
                        ส่งข้อความ
                    </button>
                </form>
            </div>

        </div>
    </section>

    <footer class="bg-bg-alt border-t border-gray-200 py-8 text-center mt-auto">
        <div class="flex items-center justify-center gap-2 text-xl font-semibold mb-2">
            <i class="fa-solid fa-scissors text-brand"></i>
            <span>Bella Salon</span>
        </div>
        <p class="text-gray-500 text-sm">© 2026 Bella Salon. All rights reserved.</p>
    </footer>

</body>
</html>
